name: Build - Antispam debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - antispam-filter

permissions:
  contents: read

concurrency:
  group: antispam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Antispam unit tests (non blocca l'APK)
        continue-on-error: true
        run: ./gradlew :feature:antispam:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app-k9mail:assembleFossDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antispam-mail-debug-apk
          path: app-k9mail/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
